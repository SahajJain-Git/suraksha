server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: suraksha-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/suraksha_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    # Validate against database/schema.sql; never let Hibernate silently modify schema
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT Configuration
suraksha:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signing (externalized via environment variable)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Token expiration in milliseconds (default: 86400000 ms = 24 hours)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Logging configuration
logging:
  level:
    org.suraksha: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

